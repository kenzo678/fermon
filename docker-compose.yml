services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fermon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fermon}
      POSTGRES_DB: ${POSTGRES_DB:-fermon}
    ports:
      - "5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fermon} -d ${POSTGRES_DB:-fermon}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  api:
    build:
      context: ./backend
      target: dev
    command: uvicorn fermon.main:app --reload --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://fermon:fermon@timescaledb:5432/fermon}
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://frontend-e2e:5173}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ./backend:/app
      - api-venv:/app/.venv
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_started

  ingestor:
    build:
      context: ./backend
      target: dev
    command: uv run python -m fermon.ingestor
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://fermon:fermon@timescaledb:5432/fermon}
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
    volumes:
      - ./backend:/app
      - ingestor-venv:/app/.venv
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_started

  simulator:
    profiles: ["simulator"]
    build:
      context: ./simulator
      target: dev
    environment:
      SIM_MQTT_HOST: ${SIM_MQTT_HOST:-mosquitto}
      SIM_MQTT_PORT: ${SIM_MQTT_PORT:-1883}
      SIM_TOPIC_PREFIX: ${SIM_TOPIC_PREFIX:-fermon}
      SIM_TANKS: ${SIM_TANKS:-tank-1:ale,tank-2:lager}
      SIM_TICK_INTERVAL_SECONDS: ${SIM_TICK_INTERVAL_SECONDS:-1}
      SIM_ACCELERATION: ${SIM_ACCELERATION:-600}
      SIM_SEED: ${SIM_SEED:-}
      SIM_DROPOUT_RATE: ${SIM_DROPOUT_RATE:-0.02}
      SIM_SPIKE_RATE: ${SIM_SPIKE_RATE:-0.01}
      SIM_DISCONNECT_RATE: ${SIM_DISCONNECT_RATE:-0.005}
    volumes:
      - ./simulator:/app
      - simulator-venv:/app/.venv
    depends_on:
      mosquitto:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - api

  # e2e: the browser runs inside the compose network, so this twin of `frontend` bakes in an API
  # address reachable from there (the normal `frontend` keeps localhost for browsers on the host).
  frontend-e2e:
    profiles: ["e2e"]
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_URL: http://api:8000
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - api
    healthcheck:
      # 127.0.0.1, not localhost: busybox resolves localhost to ::1 and Vite listens on IPv4.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173"]
      interval: 5s
      timeout: 3s
      retries: 20

  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    working_dir: /app
    command: npx playwright test
    environment:
      E2E_BASE_URL: http://frontend-e2e:5173
      E2E_API_URL: http://api:8000
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    # Containers being up isn't enough: wait until both actually serve requests.
    depends_on:
      frontend-e2e:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  timescale-data:
  api-venv:
  ingestor-venv:
  simulator-venv:
  frontend-node-modules:
